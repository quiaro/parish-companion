services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - GOOGLE_CREDENTIALS_PATH=/run/secrets/google-service-account.json
    volumes:
      - ./data:/app/data
      - ${GOOGLE_CREDENTIALS_HOST_PATH:-./secrets/google-service-account.json}:/run/secrets/google-service-account.json:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

