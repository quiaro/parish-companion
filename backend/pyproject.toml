[project]
name = "parish-companion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "lingua-language-detector>=2.2.0",
    "pydantic>=2.13.4",
