services:
  backend:
    build:
      target: dev
    env_file:
      - .env
      - .env.dev
    environment:
      - GOOGLE_CREDENTIALS_PATH=/run/secrets/google-service-account.json
    volumes:
      - ${GOOGLE_CREDENTIALS_HOST_PATH:-./secrets/google-service-account.json}:/run/secrets/google-service-account.json:ro

  redis:
    ports:
      - "6380:6379"

  postgres:
    ports:
      - "5433:5432"

