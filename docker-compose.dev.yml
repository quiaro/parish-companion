services:
  backend:
    build:
      target: dev
    env_file:
      - .env
      - .env.dev
    environment:
      - GOOGLE_CREDENTIALS_PATH=/run/secrets/google-service-account.json
      - ENVIRONMENT=development
    volumes:
      - ${GOOGLE_CREDENTIALS_HOST_PATH:-./secrets/google-service-account.json}:/run/secrets/google-service-account.json:ro

  redis:
    ports:
      - "6380:6379"

  postgres:
    ports:
      - "5433:5432"

  qdrant:
    ports:
      - "6333:6333"

  # Backups aren't needed for local dev data, and requiring AWS credentials just to
  # run `docker compose up` locally would be unnecessary friction. Assigning a profile
  # that's never activated in dev commands excludes it here without touching its
  # always-on-by-default behavior in docker-compose.yml (used as-is in production).
  backup:
    profiles: ["production-only"]

